name: baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --project runtime --locked
      - name: Lint
        run: uv run --project runtime ruff check runtime
      - name: Test
        run: uv run --project runtime pytest
      - name: Check production boundary
        run: uv run --project runtime python tools/check_release_boundaries.py

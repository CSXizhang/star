name: baseline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  runtime-and-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --project runtime --locked
      - name: Lint
        run: uv run --project runtime ruff check runtime
      - name: Test
        run: uv run --project runtime pytest
      - name: Check production boundary
        run: uv run --project runtime python tools/check_release_boundaries.py
      - name: C# checks (not executed in CI)
        run: |
          echo "CI 环境没有 Stardew Valley 游戏程序集 (STARDEW_GAME_PATH 未设置, 也不会上传游戏程序集),"
          echo "因此 C# 构建与 C# 测试 (Mod.Tests / Transport.Tests) 未执行。"
          echo "此步骤仅明确记录跳过原因, 不属于已通过检查; 本地具备游戏安装时请运行 tools/test.ps1 (可用 -RequireCSharpTests 把缺失视为失败)。"

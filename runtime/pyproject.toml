[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "stardew-ai-runtime"
version = "0.1.0"
description = "Out-of-process runtime for Stardew AI Companion"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mcp>=1.2.0,<2",
]

[project.scripts]
stardew-ai-runtime = "stardew_ai_runtime.cli:main"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["src/stardew_ai_runtime"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["runtime/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
